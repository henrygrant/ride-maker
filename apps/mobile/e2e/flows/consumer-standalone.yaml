appId: net.thg3.ridemaker
---
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      id: "text-brand"
    timeout: 20000
- assertVisible:
    id: "button-create-ride"
- assertVisible:
    id: "button-import-gpx"
- assertNotVisible:
    id: "button-test-seed-library"
- assertNotVisible:
    id: "badge-test-mode"
- assertNotVisible:
    id: "button-diagnostics-toggle"
- tapOn:
    id: "home-open-myrides"
- assertVisible:
    id: "text-library-title"
- tapOn:
    id: "button-toggle-secondary-links"
- assertVisible:
    id: "input-route-id"
- assertVisible:
    id: "button-view-route"
- assertNotVisible:
    id: "button-test-seed-library"
- takeScreenshot: consumer-standalone-main
- tapOn:
    id: "button-close-my-rides"
- assertVisible:
    id: "text-brand"
- assertVisible:
    id: "button-create-ride"
- takeScreenshot: consumer-foreground

appId: net.thg3.ridemaker.e2e
---
- launchApp:
    stopApp: false
    clearState: false
- assertVisible:
    id: "text-brand"

# Seed route 1: synthetic-track.gpx
- tapOn:
    id: "button-import-gpx"
- runFlow:
    when:
      notVisible: "synthetic-track.gpx"
    commands:
      - scrollUntilVisible:
          element: "synthetic-track.gpx"
          direction: DOWN
          timeout: 1500
          optional: true
      - scrollUntilVisible:
          element: "synthetic-track.gpx"
          direction: UP
          timeout: 1500
          optional: true
- runFlow:
    when:
      notVisible: "synthetic-track.gpx"
    commands:
      - tapOn:
          text: "Show roots"
          optional: true
      - tapOn:
          text: "Downloads"
          optional: true
      - tapOn:
          text: "ride-maker-fixtures"
          optional: true
      - scrollUntilVisible:
          element: "synthetic-track.gpx"
          direction: DOWN
          timeout: 5000
          optional: true
- tapOn: "synthetic-track.gpx"
- assertVisible:
    id: "text-route-title"
- assertVisible: "Central Park Track"
- tapOn:
    id: "button-back"
- assertVisible:
    id: "text-brand"
- tapOn:
    id: "home-open-myrides"
- assertVisible: "Central Park Track"
- tapOn:
    id: "button-close-my-rides"

# Seed route 2: synthetic-route.gpx
- tapOn:
    id: "button-import-gpx"
- runFlow:
    when:
      notVisible: "synthetic-route.gpx"
    commands:
      - scrollUntilVisible:
          element: "synthetic-route.gpx"
          direction: DOWN
          timeout: 1500
          optional: true
      - scrollUntilVisible:
          element: "synthetic-route.gpx"
          direction: UP
          timeout: 1500
          optional: true
- runFlow:
    when:
      notVisible: "synthetic-route.gpx"
    commands:
      - tapOn:
          text: "Show roots"
          optional: true
      - tapOn:
          text: "Downloads"
          optional: true
      - tapOn:
          text: "ride-maker-fixtures"
          optional: true
      - scrollUntilVisible:
          element: "synthetic-route.gpx"
          direction: DOWN
          timeout: 5000
          optional: true
- tapOn: "synthetic-route.gpx"
- assertVisible:
    id: "text-route-title"
- assertVisible: "Hudson Greenway Route"
- tapOn:
    id: "button-back"
- assertVisible:
    id: "text-brand"
- tapOn:
    id: "home-open-myrides"
- assertVisible: "Central Park Track"
- assertVisible: "Hudson Greenway Route"
- tapOn:
    id: "button-close-my-rides"

# Seed route 3: synthetic-utf8-bom.gpx (real picker BOM / non-ASCII fixture)
- tapOn:
    id: "button-import-gpx"
- runFlow:
    when:
      notVisible: "synthetic-utf8-bom.gpx"
    commands:
      - scrollUntilVisible:
          element: "synthetic-utf8-bom.gpx"
          direction: DOWN
          timeout: 1500
          optional: true
      - scrollUntilVisible:
          element: "synthetic-utf8-bom.gpx"
          direction: UP
          timeout: 1500
          optional: true
- runFlow:
    when:
      notVisible: "synthetic-utf8-bom.gpx"
    commands:
      - tapOn:
          text: "Show roots"
          optional: true
      - tapOn:
          text: "Downloads"
          optional: true
      - tapOn:
          text: "ride-maker-fixtures"
          optional: true
      - scrollUntilVisible:
          element: "synthetic-utf8-bom.gpx"
          direction: DOWN
          timeout: 5000
          optional: true
- tapOn: "synthetic-utf8-bom.gpx"
- assertVisible:
    id: "text-route-title"
- assertVisible: "München Über Berg Straße — Café René"
- tapOn:
    id: "button-back"
- assertVisible:
    id: "text-brand"
- tapOn:
    id: "home-open-myrides"
- assertVisible: "Central Park Track"
- assertVisible: "Hudson Greenway Route"
- assertVisible: "München Über Berg Straße — Café René"
- tapOn:
    id: "button-close-my-rides"

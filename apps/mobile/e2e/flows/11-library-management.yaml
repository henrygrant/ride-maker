appId: net.thg3.ridemaker.e2e
---
- launchApp:
    stopApp: false
    clearState: false
- assertVisible:
    id: "text-brand"

# 1. Seed synthetic library with 14+ rides and long names (test-only seam)
- tapOn:
    id: "home-open-myrides"
- scrollUntilVisible:
    element:
      id: "button-toggle-secondary-links"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "button-toggle-secondary-links"
- scrollUntilVisible:
    element:
      id: "button-test-seed-library"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "button-test-seed-library"
- scrollUntilVisible:
    element: "Pacific Coast Highway Scenic Vista Route from San Francisco to Santa Cruz with Ocean Overlooks and Headwinds"
    direction: UP
    timeout: 15000
- assertVisible: "Pacific Coast Highway Scenic Vista Route from San Francisco to Santa Cruz with Ocean Overlooks and Headwinds"

# 2. Real scrolling library test: scroll to bottom and open last row
- scrollUntilVisible:
    element: "Columbia River Basin Endurance Circuit Traversed Through Rolling Wheat Valleys"
    direction: DOWN
    timeout: 15000
- tapOn: "Columbia River Basin Endurance Circuit Traversed Through Rolling Wheat Valleys"
- assertVisible:
    id: "text-route-title"
- assertVisible: "Columbia River Basin Endurance Circuit Traversed Through Rolling Wheat Valleys"
- takeScreenshot: 11-scrolling-library-last-row
- tapOn:
    id: "button-back"
- assertVisible:
    id: "text-brand"

# 3. Rename test on primary UI-created ride
- tapOn:
    id: "home-open-myrides"
- scrollUntilVisible:
    element: "Morning River Loop"
    direction: UP
    timeout: 15000
- tapOn: "Morning River Loop"
- assertVisible:
    id: "text-route-title"
- assertVisible: "Morning River Loop"

# Test Rename Modal via 3-dots options menu
- tapOn:
    id: "button-ride-options"
- assertVisible:
    id: "button-rename-ride"
- tapOn:
    id: "button-rename-ride"
- assertVisible: "Rename Ride"
- assertVisible:
    id: "input-rename-ride-name"
- tapOn:
    id: "input-rename-ride-name"
- eraseText: 50
- inputText: "Morning River Sunset Loop"
- hideKeyboard
- tapOn:
    id: "button-rename-confirm"

# Verify title updated in UI
- assertVisible:
    id: "text-route-title"
- assertVisible: "Morning River Sunset Loop"
- takeScreenshot: 11-rename-confirmed

# 4. Verify across cold app restart with scroll
- tapOn:
    id: "button-back"
- stopApp
- launchApp:
    stopApp: false
    clearState: false
- assertVisible:
    id: "text-brand"
- tapOn:
    id: "home-open-myrides"
- scrollUntilVisible:
    element: "Morning River Sunset Loop"
    direction: DOWN
    timeout: 15000
- assertVisible: "Morning River Sunset Loop"

# Runner captures package-targeted storage evidence here, then runs 11b.
